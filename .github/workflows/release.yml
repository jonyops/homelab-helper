name: Build and release

# Push a tag like v1.0 (matching version.txt) to publish a signed APK for Obtainium.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK parts
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build and sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          export KEYSTORE_FILE="$RUNNER_TEMP/signing.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"
          ./build.sh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" homelab-helper.apk --title "Homelab Helper $GITHUB_REF_NAME" --notes "Signed build of $GITHUB_REF_NAME."
